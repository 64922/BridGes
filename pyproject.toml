[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridges"
version = "0.1.0"
description = "BridGes —— 长期科学学习与表达伙伴"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "pymupdf>=1.28",
    "cryptography>=42.0",
    "keyring>=25.0",
    # GQ-08：Windows 无系统 IANA 时区库，zoneinfo 需要 tzdata 包提供
    # （提醒时区换算依赖，缺失时 Asia/Shanghai 等时区校验直接崩溃）。
    "tzdata>=2024.1; platform_system == \"Windows\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
# Issue 41：旧 science-companion 迁移期兼容入口已随退出 Issue 移除，
# 规范命令入口仅保留 BridGes。
BridGes = "bridges.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bridges"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
