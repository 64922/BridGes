[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridges"
version = "0.1.0"
description = "BridGes —— 长期科学学习与表达伙伴"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "pymupdf>=1.28",
    "cryptography>=42.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
# BridGes 为规范命令入口；science-companion 为迁移期兼容层入口，
# 与 BridGes 指向同一实现，不维护两套 CLI。兼容层由退出 Issue 删除。
BridGes = "bridges.cli.main:app"
science-companion = "bridges.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bridges", "src/science_companion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
