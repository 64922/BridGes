services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BRIDGES_ENVIRONMENT=production
      - BRIDGES_API_HOST=0.0.0.0
      - BRIDGES_API_PORT=8000
      - BRIDGES_WEB_DEV=false
      - BRIDGES_DATABASE_URL=sqlite:////var/lib/bridges/bridges.db
    volumes:
      - bridges-data:/var/lib/bridges
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request; payload = json.load(
          urllib.request.urlopen('http://localhost:8000/health/ready')
          ); raise SystemExit(0 if payload.get('ready') == 'pass' else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_signal: SIGTERM

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
      - BRIDGES_WEB_DEV=false
      - BRIDGES_WEB_PORT=3000
    depends_on:
      api:
        condition: service_healthy
    stop_signal: SIGTERM

  # 后台执行器与提醒调度器与 API 使用同一镜像与入口：共享 bridges-data 卷、
  # 同一密钥自举与数据库地址，保证数据、对象与加密凭据语义与 API 完全一致。
  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - BRIDGES_ENVIRONMENT=production
      - BRIDGES_DATABASE_URL=sqlite:////var/lib/bridges/bridges.db
    volumes:
      - bridges-data:/var/lib/bridges
    depends_on:
      api:
        condition: service_healthy
    stop_signal: SIGTERM
    command: ["BridGes", "worker"]

  scheduler:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - BRIDGES_ENVIRONMENT=production
      - BRIDGES_DATABASE_URL=sqlite:////var/lib/bridges/bridges.db
    volumes:
      - bridges-data:/var/lib/bridges
    depends_on:
      api:
        condition: service_healthy
    stop_signal: SIGTERM
    command: ["BridGes", "scheduler"]

# Podman-compatible: podman-compose -f infra/compose/docker-compose.yml up
# Production images use standard Python and Node.js runtimes.
# 容器部署不要求宿主机创建 `.env`：全部运行配置由上方 Compose 环境变量注入，
# 秘密（如 BRIDGES_SECRET_KEY、BRIDGES_QWEN_API_KEY）可通过
# `docker compose run -e`、`--env-file` 或受保护账户设置提供。

volumes:
  bridges-data:
