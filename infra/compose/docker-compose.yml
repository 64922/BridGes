services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    environment:
      - SCIENCE_COMPANION_ENVIRONMENT=production
      - SCIENCE_COMPANION_API_HOST=0.0.0.0
      - SCIENCE_COMPANION_API_PORT=8000
      - SCIENCE_COMPANION_WEB_DEV=false
      - SCIENCE_COMPANION_DATABASE_URL=sqlite:////var/lib/science-companion/science_companion.db
    volumes:
      - api-data:/var/lib/science-companion
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request; payload = json.load(
          urllib.request.urlopen('http://localhost:8000/health/ready')
          ); raise SystemExit(0 if payload.get('ready') == 'pass' else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_signal: SIGTERM

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
      - SCIENCE_COMPANION_WEB_DEV=false
      - SCIENCE_COMPANION_WEB_PORT=3000
    depends_on:
      api:
        condition: service_healthy
    stop_signal: SIGTERM

# Podman-compatible: podman-compose -f infra/compose/docker-compose.yml up
# Production images use standard Python and Node.js runtimes.

volumes:
  api-data:
